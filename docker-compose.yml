version: '3.8'

services:
  # ============================================================
  # PostgreSQL データベース
  # ============================================================
  postgres:
    image: postgres:16-alpine
    container_name: routine-design-db
    environment:
      POSTGRES_DB: ${DB_NAME:-routine_design}
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
      TZ: Asia/Tokyo
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/sql/schema:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - app-network

  # ============================================================
  # Go API サーバー（Gin + Air ホットリロード）
  # ============================================================
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: routine-design-api
    ports:
      - "${API_PORT:-8080}:8080"
    volumes:
      - ./backend:/app
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: ${DB_USER:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-postgres}
      DB_NAME: ${DB_NAME:-routine_design}
      DB_SSLMODE: disable
      JWT_SECRET: ${JWT_SECRET:-dev-secret-key-change-in-production}
      GIN_MODE: debug
      TZ: Asia/Tokyo
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - app-network

  # ============================================================
  # Vue 3 フロントエンド（Vite dev server ホットリロード）
  # ============================================================
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: routine-design-web
    ports:
      - "${WEB_PORT:-5173}:5173"
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    environment:
      VITE_API_BASE_URL: http://localhost:${API_PORT:-8080}/api
    depends_on:
      - backend
    networks:
      - app-network

volumes:
  postgres_data:
    driver: local
  frontend_node_modules:
    driver: local

networks:
  app-network:
    driver: bridge
